name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: ${{ github.repository_owner == 'cloudflare' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install modules
        run: npm ci

      - name: Create Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          createGithubReleases: true
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and verify dist-tags
        if: steps.changesets.outputs.published == 'true'
        env:
          RELEASE_TAG: v${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}
        run: |
          MAJOR_TAG="${RELEASE_TAG%%.*}"
          git push --force origin "${RELEASE_TAG}^{commit}:refs/tags/${MAJOR_TAG}"
          git fetch --force origin "refs/tags/${MAJOR_TAG}:refs/tags/${MAJOR_TAG}"
          git cat-file -e "${MAJOR_TAG}:dist/index.mjs"
